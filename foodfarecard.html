<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodFareCard - Mukbang Food Town</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🍓 Mukbang Food Town 🚇</h1>

        <nav>
            <a href="index.html">🏠 Home</a>
            <a href="foodfarecard.html">💳 FoodFareCard</a>

        </nav>
    </header>

    <main>
        <section>
            <h2>💳 FoodFareCard</h2>

            <p>Enter your FoodFareCard number.</p>

            <input
                type="text"
                id="cardNumber"
                placeholder="0 00 000 0000"
                maxlength="13"
            >

            <br><br>

            <button onclick="checkCard()">
                💳 Check Balance
            </button>

            <p id="message"></p>
        </section>
        <hr>

<h2>🛒 Buy a FoodFareCard</h2>

<p>Choose your card:</p>

<button onclick="buyCard('adult')">
    🔴 Adult Card
</button>

<button onclick="buyCard('kids')">
    🩷 Kids Card
</button>

<p id="buyMessage"></p>
    </main>

    <script>
        function checkCard() {
            const card = document.getElementById("cardNumber").value;
            const message = document.getElementById("message");

            if (card === "0 00 000 0001") {
                message.textContent = "Card found! 🍵 Balance: 1,000 Matcha";
            } else {
                message.textContent =
                    "yk what bro idk if this exists try again or smth";
                function buyCard(type) {
    const message = document.getElementById("buyMessage");

    if (type === "adult") {
        message.textContent =
            "🔴 Adult FoodFareCard selected — 101 Matcha ($1.01)";
    }

    if (type === "kids") {
        message.textContent =
            "🩷 Kids FoodFareCard selected — 101 Matcha ($1.01)";
    }
}        
    </script>

</body>
